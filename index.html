<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тартил: чтение Корана по памяти</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14213d;--mute:#5b6577;--line:#d5dbe3;--accent:#1d4e89;--ok:#1b7f5c;--bad:#c0392b;--miss:#b7791f;--okbg:#dff3ea;--badbg:#fbe4e1;--missbg:#fbefd5;--pill:#cfd8e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mute:#9aa6bd;--line:#2b3957;--accent:#6fa8ee;--ok:#5fd0a0;--bad:#ff8a7a;--miss:#f0c066;--okbg:#14382c;--badbg:#45211d;--missbg:#40320f;--pill:#34445f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mute:#9aa6bd;--line:#2b3957;--accent:#6fa8ee;--ok:#5fd0a0;--bad:#ff8a7a;--miss:#f0c066;--okbg:#14382c;--badbg:#45211d;--missbg:#40320f;--pill:#34445f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:620px;margin:0 auto;padding:12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px}
.sel{display:flex;gap:8px}
select{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem;padding:0 8px}
#ay{flex:0 0 38%}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);font-size:.95rem;font-weight:600;cursor:pointer;padding:0 6px}
.btn.sec{background:var(--card);color:var(--accent)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.btn:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stat{margin:8px 0 0;font-size:.9rem;color:var(--mute)}
.stat b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
#text{font-family:Amiri,"Traditional Arabic","Scheherazade New",serif;font-size:1.9rem;line-height:2.4;direction:rtl;text-align:justify}
.w{padding:0 3px;border-radius:7px;cursor:pointer}
.w.hid{background:var(--pill);color:transparent;user-select:none}
.w.hid.peek{background:none;color:inherit}
.w.ok{background:var(--okbg);color:var(--ok)}
.w.bad{background:var(--badbg);color:var(--bad)}
.w.miss{background:var(--missbg);color:var(--miss)}
.w.skip{opacity:.45}
.w.cur{box-shadow:0 3px 0 var(--accent)}
.num{color:var(--accent);font-size:1.2rem;padding:0 2px;user-select:none}
.msg{color:var(--mute);font-size:.85rem;margin:8px 0 0}
</style>
</head>
<body>
<main>
<div class="bar">
  <div class="sel">
    <select id="su" aria-label="Сура"></select>
    <select id="ay" aria-label="Начать с аята"></select>
  </div>
  <div class="row">
    <button class="btn" id="go">Начать</button>
    <button class="btn sec" id="hd">Текст: скрыт</button>
  </div>
  <div class="row">
    <button class="btn sec" id="lis">Слушать аят</button>
    <button class="btn sec" id="rs">Сначала</button>
  </div>
  <p class="stat" id="stat" aria-live="polite"></p>
</div>
<section class="card"><div id="text" lang="ar"></div></section>
<p class="msg" id="msg">Загрузка…</p>
<p class="msg">Читайте вслух: слова открываются по мере верного чтения. Красное: другое слово, жёлтое: пропущено. Нажмите на скрытое слово, чтобы подсмотреть. Проверяются слова, не тааджвид.</p>
</main>
<script>
var API="https://api.alquran.cloud/v1/",sura=1,W=[],AU=[],pos=0,run=false,hide=true,st={ok:0,bad:0,miss:0},audio=null,lastT="";
var $=function(i){return document.getElementById(i)};
function norm(s){return s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[\u0671\u0622\u0623\u0625]/g,"\u0627").replace(/\u0649/g,"\u064A").replace(/\u0629/g,"\u0647").replace(/\u0627/g,"").trim()}
function words(s){return s.split(/\s+/).filter(Boolean)}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=0;j<=n;j++)d[0][j]=j;
 for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function sim(a,b){var L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1}
function msg(t){$("msg").textContent=t}
function ar(n){return String(n).replace(/\d/g,function(d){return"٠١٢٣٤٥٦٧٨٩"[d]})}

function view(i){
  var w=W[i],c="w";
  if(w.s)c+=" "+w.s;else if(w.skip)c+=" skip";else if(hide&&!w.peek)c+=" hid";else if(hide)c+=" hid peek";
  if(i===pos&&run)c+=" cur";
  w.el.className=c;
}
function stat(){
  var n=st.ok+st.bad+st.miss,p=n?Math.round(st.ok/n*100):0;
  $("stat").innerHTML="Верно <b>"+st.ok+"</b> · ошибок <b>"+st.bad+"</b> · пропущено <b>"+st.miss+"</b> · точность <b>"+p+"%</b> · слово "+Math.min(pos+1,W.length)+"/"+W.length;
}
function update(oldPos){
  for(var i=Math.max(0,oldPos-1);i<=Math.min(W.length-1,pos);i++)view(i);
  stat();
  if(W[pos])W[pos].el.scrollIntoView({block:"center",behavior:"smooth"});
  if(pos>=W.length&&run){stop();msg("Сура завершена! Точность: "+Math.round(st.ok/Math.max(1,st.ok+st.bad+st.miss)*100)+"%")}
}
function mark(i,s){W[i].s=s}
function feed(list){
  var old=pos;
  list.forEach(function(h){
    if(pos>=W.length)return;
    var hn=norm(h);if(!hn)return;
    var k=-1,j;
    for(j=0;j<4&&pos+j<W.length;j++){if(sim(hn,W[pos+j].n)>=0.7){k=j;break}}
    if(k<0){mark(pos,"bad");st.bad++;pos++}
    else{for(j=0;j<k;j++){mark(pos,"miss");st.miss++;pos++}mark(pos,"ok");st.ok++;pos++}
  });
  update(old);
}
function reset(){
  stop();var a=+$("ay").value;st={ok:0,bad:0,miss:0};pos=0;
  W.forEach(function(w){w.s="";w.peek=false;w.skip=w.a<a-1});
  while(pos<W.length&&W[pos].a<a-1)pos++;
  for(var i=0;i<W.length;i++)view(i);
  stat();msg("Нажмите «Начать» и читайте вслух.");
  if(W[pos])W[pos].el.scrollIntoView({block:"center"});
}
function load(n){
  stop();sura=n;msg("Загрузка…");
  fetch(API+"surah/"+n+"/editions/quran-uthmani,ar.alafasy").then(function(r){return r.json()}).then(function(j){
    var a=j.data[0].ayahs,box=$("text"),ay=$("ay");
    AU=j.data[1].ayahs.map(function(x){return x.audio});W=[];box.innerHTML="";ay.innerHTML="";
    a.forEach(function(x,i){
      var ws=words(x.text);
      if(i===0&&n!==1&&n!==9&&norm(ws[0])==="بسم")ws=ws.slice(4);
      ws.forEach(function(t){
        var s=document.createElement("span"),o={n:norm(t),a:i,el:s,s:"",peek:false,skip:false};
        s.textContent=t;s.onclick=function(){if(!o.s){o.peek=!o.peek;view(W.indexOf(o))}};
        W.push(o);box.appendChild(s);box.appendChild(document.createTextNode(" "));
      });
      var m=document.createElement("span");m.className="num";m.textContent="\uFD3F"+ar(i+1)+"\uFD3E";
      box.appendChild(m);box.appendChild(document.createTextNode(" "));
      var op=document.createElement("option");op.value=i+1;op.textContent="Аят "+(i+1);ay.appendChild(op);
    });
    reset();
  }).catch(function(){msg("Не удалось загрузить данные. Нужен интернет.")});
}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
function ui(){var g=$("go");g.textContent=run?"Стоп":"Начать";g.className="btn"+(run?" stop":"")}
function stop(){run=false;if(rec){try{rec.stop()}catch(e){}}ui();if(W[pos])view(pos)}
if(SR){
  rec=new SR();rec.lang="ar-SA";rec.continuous=true;rec.interimResults=false;
  rec.onstart=function(){lastT=""};
  rec.onresult=function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal)continue;
      var t=e.results[i][0].transcript.trim();
      var add=(lastT&&t.indexOf(lastT)===0)?t.slice(lastT.length):t;
      lastT=t;feed(words(add));
    }
  };
  rec.onend=function(){if(run){try{rec.start()}catch(e){}}};
  rec.onerror=function(e){
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){stop();msg("Нет доступа к микрофону. Разрешите его в браузере.")}
    else if(e.error!=="no-speech"&&e.error!=="aborted")msg("Ошибка распознавания: "+e.error);
  };
}else{$("go").disabled=true;msg("Распознавание речи не поддерживается. Откройте в Chrome или Edge.")}
$("go").onclick=function(){
  if(run){stop();return}
  if(pos>=W.length)reset();
  try{rec.start();run=true;ui();view(pos);msg("Слушаю… читайте с выбранного места.")}catch(e){msg("Не удалось запустить микрофон.")}
};
$("hd").onclick=function(){hide=!hide;this.textContent="Текст: "+(hide?"скрыт":"виден");for(var i=0;i<W.length;i++)view(i)};
$("rs").onclick=reset;
$("ay").onchange=reset;
$("su").onchange=function(){load(+this.value)};
$("lis").onclick=function(){
  if(audio)audio.pause();
  var i=W[Math.min(pos,W.length-1)];if(!i)return;
  audio=new Audio(AU[i.a]);audio.play().catch(function(){msg("Не удалось воспроизвести аудио.")});
};
fetch(API+"surah").then(function(r){return r.json()}).then(function(j){
  j.data.forEach(function(x){var o=document.createElement("option");o.value=x.number;o.textContent=x.number+". "+x.englishName+" ("+x.numberOfAyahs+")";$("su").appendChild(o)});
  load(1);
}).catch(function(){msg("Не удалось загрузить список сур. Нужен интернет.")});
</script>
</body>
</html>
